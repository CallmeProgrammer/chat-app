<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <!-- Mobile viewport (VERY IMPORTANT) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chat App</title>
  <!-- Pixelify Sans Font -->
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Top Bar (Mobile) -->
  <div class="top-bar">
    <button id="menuBtn">☰</button>
    <span class="title">MYChat</span>
  </div>

  <!-- Main Layout -->
  <div class="chat-container">

    <!-- Users Panel -->
    <div class="users" id="users"></div>

    <!-- Chat Area -->
    <div class="chat-box">

      <!-- Messages -->
      <div id="messages"></div>

      <!-- Input -->
      <div class="input-box">
        <input type="text" id="msg" placeholder="Type a message..." autocomplete="off">
        <button onclick="send()">➤</button>
      </div>

    </div>

  </div>

  <!-- Socket -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <!-- App Script -->
  <script src="script.js"></script>

</body>

</html>
